:root { --bg: #FAF8F5; --sf: #FFFFFF; --tx: #2B2B2B; --acc: #1F4E79; --tint: #E3EDF6; --mut: #655F5A; --line: #ECE8E2; --good: #2E7D4F; --warn: #9A5F08; --bad: #B93226; --stage: #E9E5DF;
  --font: "CM Lato", Lato, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color-scheme: light; }
[data-theme="dark"] { --bg: #16181D; --sf: #21242B; --tx: #ECECEC; --acc: #6FA3D3; --tint: #26384A; --mut: #A8A29C; --line: #343842; --good: #6CC18E; --warn: #E9B35A; --bad: #F08A7E; --stage: #0F1115; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: 900; }
h2 { font-size: 17px; margin: 0 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 12px; margin: 18px 0 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--mut); }
p { margin: 0 0 10px; } ol, ul { margin: 0 0 10px; padding-left: 22px; } li { margin-bottom: 5px; }
.muted { color: var(--mut); } .small { font-size: 13px; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.boot { padding: 40px; color: #655F5A; }
.ic { width: 20px; height: 20px; flex: none; }

/* make */

.th-sw b { color: var(--a); font-size: 17px; line-height: 24px; text-align: center; } .th-sw.bar b { background: var(--a); color: #fff; }
.th-sw i { height: 8px; border-top: 1px solid; border-bottom: 1px solid; } .th-sw em { flex: 1; margin: 0 5px 5px; border: 1px solid; border-top: 0; background: linear-gradient(90deg, transparent 32%, currentColor 32% 33.500%, transparent 33.500% 65%, currentColor 65% 66.500%, transparent 66.500%); color: #D8D4CE; }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.fo { border: 2px solid var(--line); background: var(--sf); border-radius: 10px; padding: 6px 8px; min-height: 42px; cursor: pointer; font-size: 16px; } .fo.on { border-color: var(--acc); background: var(--tint); } .fo:first-child { font-weight: 700; font-size: 14px; }
.hol-h h3 { margin: 16px 0 6px; } .hol-list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.ev-ic { width: 22px; height: 22px; display: grid; place-items: center; flex: none; } .ev-ic .evi { width: 20px; height: 20px; } .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.ev-tx { min-width: 0; } .ev-tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ev-tx small { color: var(--mut); font-size: 12.5px; }
.own-add { margin-top: 8px; }
.stage .it.hol[data-ev]:hover { text-decoration: underline; }
.empty-s { border: 1px dashed #CFC8BF; border-radius: 12px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 4px; color: var(--mut); font-size: 14px; } .empty-s b { color: var(--tx); }
.cats { margin-top: 18px; } .cats summary, .faq summary { cursor: pointer; font-weight: 700; } .cat-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.cat-row { display: flex; gap: 8px; align-items: center; } .cat-row input[type=color] { width: 44px; height: 40px; padding: 2px; border: 1px solid #CFC8BF; border-radius: 10px; background: var(--bg); flex: none; cursor: pointer; }
.mk-prev { background: var(--stage); min-width: 0; padding: 14px 18px 20px; display: flex; flex-direction: column; }
.pv-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; } .pv-label { font-weight: 900; font-size: 16px; min-width: 150px; text-align: center; } .pv-gap { flex: 1; }

.pr-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; align-items: start; }
.steps li { margin-bottom: 8px; } .pt-h { margin-top: 0; }

@media (max-width: 899px) { .app { grid-template-columns: 1fr; } .side { display: none; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--sf); border-top: 1px solid var(--line); z-index: 30; padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); }

  #printroot .sheet { break-after: page; page-break-after: always; } #printroot .sheet:last-child { break-after: auto; page-break-after: auto; } }

/* ---------- the printable page (real inches) ---------- */

  'save-file': () => { const c = cal(); if (c) { App.download(App.slug(c.name) + '.calendar.json', CalStore.fileOf(c)); App.toast('Calendar file saved to your Downloads folder.'); } },

  'remove-samples': () => { const st = CalStore.get(); const gone = st.calendars.filter(c => c.sample); if (!gone.length) return; const keep = st.calendars.slice(); st.calendars = st.calendars.filter(c => !c.sample); if (!CalStore.find(st.openId)) st.openId = ''; CalStore.save(); App.render(); App.toast('Samples removed. Your own calendars are untouched.', () => { st.calendars = keep; CalStore.save(); App.render(); }); },
  'add-samples': () => { const st = CalStore.get(); st.calendars = st.calendars.filter(c => !c.sample).concat(CalSample.build(S(), CalStore.today())); CalStore.save(); App.render(); App.toast('Samples added to My calendars.'); },
  erase: () => { App.ui.confirm = { title: 'Erase everything?', text: 'This deletes every calendar and setting saved in this browser. It cannot be undone. Save a backup file first if you might want them back.', yes: 'Erase everything', danger: true, fn: () => { CalStore.eraseAll(); App.ui.screen = 'home'; App.ui.undo = []; } }; App.render(); },
  'confirm-yes': () => { const c = App.ui.confirm; App.ui.confirm = null; if (c && c.fn) c.fn(); App.render(); }, 'confirm-no': () => { App.ui.confirm = null; App.render(); },
  undo: () => { const u = App.ui.undo; const c = cal(); if (!u.length || !c) return; const prev = CalStore.clean(JSON.parse(u.pop())); const st = CalStore.get(); const i = st.calendars.indexOf(c); prev.id = c.id; st.calendars[i] = prev; CalStore.save(); App.render(); App.toast('Undone.'); },
  step: el => { const c = cal(); const y = c.year + (+el.dataset.d); if (y >= E.MIN_YEAR && y <= E.MAX_YEAR) App.setKey('year', y); },
  today: () => { const t = CalStore.today(); App.edit(c => { c.year = t.y; c.month = t.m; }); App.ui.pv = 0; App.drawPreview(); },

App.boot = () => {

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');

    if (t.dataset.hol) { App.edit(c => { const x = E.SETS[c.hol.country].list.find(h => h.id === t.dataset.hol); if (!x) return; delete c.hol.off[x.id]; delete c.hol.on[x.id]; if (x.def && !t.checked) c.hol.off[x.id] = true; if (!x.def && t.checked) c.hol.on[x.id] = true; }); return; }
    if (!k || k === 'name' || k === 'title') return; if (t.type === 'checkbox') return App.setKey(k, t.checked); if (k === 'year') { const y = Math.round(+t.value); if (!(y >= E.MIN_YEAR && y <= E.MAX_YEAR)) { App.toast('Use a year from 1900 to 2100.'); t.value = cal().year; return; } } App.setKey(k, t.value); });

  });

  const faces = ['400 16px "CM Lato"', '700 16px "CM Lato"', '900 16px "CM Lato"', '700 16px "CM Playfair"', '700 16px "CM Montserrat"', '400 16px "CM Pacifico"', '600 16px "CM Fredoka"', '700 16px "CM Dancing"'];
  let drawn = false; const draw = () => { if (drawn) return; drawn = true; App.render(); };

};
